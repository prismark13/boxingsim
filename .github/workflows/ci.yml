name: build and test

# The suite is the whole safety net for this project — two golden-master fingerprints, the matchmaking
# guards, the clock invariants — and it takes two and a half minutes. That is cheap here and expensive on a
# laptop, where running it after every edit is what actually happens and is why it stops being run.
#
# Windows, because the desktop app is WPF and the solution does not build anywhere else. The Core and Tests
# projects would run on Linux, but building half a solution to save a minute is a false economy.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore BoxingSim.slnx

      - name: Build
        run: dotnet build BoxingSim.slnx -c Release --no-restore --nologo

      - name: Test
        run: dotnet test tests/BoxingSim.Tests/BoxingSim.Tests.csproj -c Release --no-build --nologo

      # The fingerprints are written out beside the test binary precisely so a failure can be READ rather
      # than guessed at. When one moves, the diff is the whole story — so keep it.
      - name: Keep the golden-master dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-master
          path: tests/BoxingSim.Tests/bin/Release/net10.0/golden-*.txt
          if-no-files-found: ignore
