# DEPRECATED. The Blazor build is no longer the product - development moved to the WPF desktop app, and the
# web version has not kept up: ring position, the mileage-based career model, the generated commentary, the
# audio and the whole fight-night screen are desktop-only. It is left buildable rather than deleted because
# the fighter roster still lives under src/BoxingSim.App/wwwroot/data/fighters.json, which the DESKTOP app
# embeds - removing the project would take the roster with it.
#
# No longer deploys on push. Run it by hand if a web build is ever wanted again.
name: Deploy Blazor WASM to GitHub Pages (deprecated)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Rewrite base href for project page (/boxingsim/) BEFORE build
        # Must run before publish so the service-worker integrity manifest is
        # computed against the rewritten index.html (otherwise the SW fails to
        # validate the app and the game won't boot).
        run: sed -i 's|<base href="/" />|<base href="/boxingsim/" />|g' src/BoxingSim.App/wwwroot/index.html

      - name: Publish
        run: dotnet publish src/BoxingSim.App/BoxingSim.App.csproj -c Release -o release

      - name: SPA fallback (client-side routing)
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Add .nojekyll (serve _framework folder)
        run: touch release/wwwroot/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
