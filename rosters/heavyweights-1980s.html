<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>heavyweights 1980s</title>
<style>
  :root {
    --bg0:#0a0e1a; --bg1:#121a2e; --card:rgba(255,255,255,.04); --line:rgba(255,255,255,.09);
    --text:#e8ecf5; --muted:#8b96b0; --accent:#ff5a3c;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; color:var(--text); font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(1200px 800px at 70% -10%, #1c2747 0%, transparent 60%), linear-gradient(180deg,var(--bg0),var(--bg1));
    min-height:100vh;
  }
  header {
    position:sticky; top:0; z-index:10; backdrop-filter:blur(14px);
    background:rgba(10,14,26,.72); border-bottom:1px solid var(--line); padding:18px 24px;
  }
  .title { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .title h1 { margin:0; font-size:22px; letter-spacing:.3px; }
  .title .count { color:var(--muted); font-size:13px; }
  .title .glove { color:var(--accent); }
  .controls { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; align-items:center; }
  input,select {
    background:rgba(255,255,255,.05); color:var(--text); border:1px solid var(--line);
    border-radius:10px; padding:9px 12px; font-size:14px; outline:none;
  }
  input { min-width:220px; }
  input:focus,select:focus { border-color:var(--accent); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip {
    cursor:pointer; padding:6px 12px; border-radius:999px; border:1px solid var(--line);
    background:transparent; color:var(--muted); font-size:13px; transition:.15s;
  }
  .chip:hover { color:var(--text); }
  .chip.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  main { padding:24px; max-width:1500px; margin:0 auto; }
  .grid { display:grid; gap:18px; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); }
  .card {
    background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px;
    transition:transform .18s, border-color .18s, box-shadow .18s; position:relative; overflow:hidden;
  }
  .card:hover { transform:translateY(-4px); border-color:rgba(255,90,60,.45); box-shadow:0 18px 40px -20px rgba(0,0,0,.8); }
  .card .top { display:flex; align-items:center; gap:16px; }
  .ring { --v:0; width:64px; height:64px; flex:0 0 64px; border-radius:50%;
    background:conic-gradient(var(--rc) calc(var(--v)*1%), rgba(255,255,255,.08) 0);
    display:grid; place-items:center; }
  .ring span { width:50px; height:50px; border-radius:50%; background:var(--bg1);
    display:grid; place-items:center; font-weight:700; font-size:20px; }
  .ident { min-width:0; }
  .ident .name { font-weight:650; font-size:17px; line-height:1.2; }
  .ident .nick { color:var(--accent); font-size:13px; font-style:italic; }
  .ident .meta { color:var(--muted); font-size:12.5px; margin-top:3px; }
  .badge { display:inline-block; padding:2px 9px; border-radius:999px; font-size:11px;
    background:rgba(255,255,255,.07); border:1px solid var(--line); margin-right:6px; }
  .style { display:inline-block; margin-top:6px; padding:3px 10px; border-radius:999px;
    font-size:11.5px; font-weight:600; letter-spacing:.2px; cursor:help; }
  .radar { display:block; margin:14px auto 6px; }
  .bars { margin-top:8px; }
  .bar { display:grid; grid-template-columns:84px 1fr 28px; align-items:center; gap:8px; margin:5px 0; }
  .bar .lbl { color:var(--muted); font-size:11.5px; }
  .bar .track { height:7px; border-radius:6px; background:rgba(255,255,255,.07); overflow:hidden; }
  .bar .fill { height:100%; border-radius:6px; }
  .bar .val { text-align:right; font-size:12px; font-variant-numeric:tabular-nums; }
  .empty { color:var(--muted); text-align:center; padding:60px; }
  footer { color:var(--muted); font-size:12px; text-align:center; padding:30px; }
</style>
</head>
<body>
<header>
  <div class="title">
    <h1><span class="glove">&#129354;</span> heavyweights 1980s</h1>
    <span class="count" id="count"></span>
  </div>
  <div class="controls">
    <input id="search" type="search" placeholder="Search fighters...">
    <select id="sort">
      <option value="overall">Sort: Overall</option>
      <option value="name">Sort: Name</option>
      <option value="age">Sort: Age</option>
      <option value="power">Sort: Power</option>
      <option value="speed">Sort: Speed</option>
    </select>
    <div class="chips" id="chips"></div>
  </div>
  <div class="controls"><div class="chips" id="styleChips"></div></div>
</header>
<main><div class="grid" id="grid"></div></main>
<footer>Ratings are subjective estimates generated by Boxing Simulator &mdash; not from any published game.</footer>

<script>
const FIGHTERS = [{"name":"Larry Holmes","nickname":"The Easton Assassin","division":"Heavyweight","age":32,"record":"69-6-0 (44 KO)","overall":86,"style":"Out-Boxer","styleDesc":"Fights at range behind the jab; movement and accuracy over power.","stats":[{"label":"Power","value":84},{"label":"Chin","value":86},{"label":"Speed","value":82},{"label":"Defense","value":88},{"label":"Stamina","value":90},{"label":"Accuracy","value":93},{"label":"Conditioning","value":88},{"label":"Cut Resist","value":80},{"label":"Aggression","value":74},{"label":"Heart","value":90}]},{"name":"Michael Spinks","nickname":"Jinx","division":"Heavyweight","age":31,"record":"31-1-0 (21 KO)","overall":83,"style":"Out-Boxer","styleDesc":"Fights at range behind the jab; movement and accuracy over power.","stats":[{"label":"Power","value":81},{"label":"Chin","value":78},{"label":"Speed","value":86},{"label":"Defense","value":88},{"label":"Stamina","value":84},{"label":"Accuracy","value":86},{"label":"Conditioning","value":86},{"label":"Cut Resist","value":80},{"label":"Aggression","value":72},{"label":"Heart","value":88}]},{"name":"Gerry Cooney","nickname":"Gentleman","division":"Heavyweight","age":25,"record":"28-3-0 (24 KO)","overall":75,"style":"Slugger","styleDesc":"Huge power and comes to end it; defense is an afterthought.","stats":[{"label":"Power","value":95},{"label":"Chin","value":72},{"label":"Speed","value":72},{"label":"Defense","value":67},{"label":"Stamina","value":64},{"label":"Accuracy","value":78},{"label":"Conditioning","value":64},{"label":"Cut Resist","value":72},{"label":"Aggression","value":84},{"label":"Heart","value":74}]},{"name":"Tim Witherspoon","nickname":"Terrible Tim","division":"Heavyweight","age":28,"record":"55-13-1 (38 KO)","overall":80,"style":"Boxer-Puncher","styleDesc":"Blends real boxing skill with genuine pop \u2014 adaptable.","stats":[{"label":"Power","value":85},{"label":"Chin","value":84},{"label":"Speed","value":78},{"label":"Defense","value":80},{"label":"Stamina","value":74},{"label":"Accuracy","value":80},{"label":"Conditioning","value":70},{"label":"Cut Resist","value":78},{"label":"Aggression","value":80},{"label":"Heart","value":82}]},{"name":"Pinklon Thomas","nickname":"Pink","division":"Heavyweight","age":27,"record":"43-7-1 (34 KO)","overall":81,"style":"Boxer-Puncher","styleDesc":"Blends real boxing skill with genuine pop \u2014 adaptable.","stats":[{"label":"Power","value":82},{"label":"Chin","value":82},{"label":"Speed","value":78},{"label":"Defense","value":83},{"label":"Stamina","value":80},{"label":"Accuracy","value":87},{"label":"Conditioning","value":78},{"label":"Cut Resist","value":78},{"label":"Aggression","value":76},{"label":"Heart","value":80}]},{"name":"Greg Page","nickname":"The Flea","division":"Heavyweight","age":26,"record":"58-17-1 (48 KO)","overall":79,"style":"Slugger","styleDesc":"Huge power and comes to end it; defense is an afterthought.","stats":[{"label":"Power","value":85},{"label":"Chin","value":80},{"label":"Speed","value":83},{"label":"Defense","value":80},{"label":"Stamina","value":70},{"label":"Accuracy","value":83},{"label":"Conditioning","value":66},{"label":"Cut Resist","value":78},{"label":"Aggression","value":74},{"label":"Heart","value":74}]},{"name":"Michael Dokes","nickname":"Dynamite","division":"Heavyweight","age":26,"record":"53-6-2 (34 KO)","overall":80,"style":"Boxer-Puncher","styleDesc":"Blends real boxing skill with genuine pop \u2014 adaptable.","stats":[{"label":"Power","value":85},{"label":"Chin","value":78},{"label":"Speed","value":84},{"label":"Defense","value":80},{"label":"Stamina","value":72},{"label":"Accuracy","value":84},{"label":"Conditioning","value":68},{"label":"Cut Resist","value":78},{"label":"Aggression","value":82},{"label":"Heart","value":78}]},{"name":"Tony Tucker","nickname":"TNT","division":"Heavyweight","age":28,"record":"57-7-0 (47 KO)","overall":81,"style":"Slugger","styleDesc":"Huge power and comes to end it; defense is an afterthought.","stats":[{"label":"Power","value":85},{"label":"Chin","value":82},{"label":"Speed","value":78},{"label":"Defense","value":82},{"label":"Stamina","value":80},{"label":"Accuracy","value":82},{"label":"Conditioning","value":78},{"label":"Cut Resist","value":74},{"label":"Aggression","value":76},{"label":"Heart","value":85}]},{"name":"Trevor Berbick","nickname":"The Fighting Preacher","division":"Heavyweight","age":29,"record":"49-11-1 (33 KO)","overall":80,"style":"Boxer-Puncher","styleDesc":"Blends real boxing skill with genuine pop \u2014 adaptable.","stats":[{"label":"Power","value":80},{"label":"Chin","value":85},{"label":"Speed","value":72},{"label":"Defense","value":76},{"label":"Stamina","value":85},{"label":"Accuracy","value":76},{"label":"Conditioning","value":82},{"label":"Cut Resist","value":80},{"label":"Aggression","value":78},{"label":"Heart","value":85}]},{"name":"James Smith","nickname":"Bonecrusher","division":"Heavyweight","age":30,"record":"44-17-1 (32 KO)","overall":76,"style":"Slugger","styleDesc":"Huge power and comes to end it; defense is an afterthought.","stats":[{"label":"Power","value":89},{"label":"Chin","value":80},{"label":"Speed","value":68},{"label":"Defense","value":66},{"label":"Stamina","value":72},{"label":"Accuracy","value":72},{"label":"Conditioning","value":74},{"label":"Cut Resist","value":78},{"label":"Aggression","value":78},{"label":"Heart","value":80}]},{"name":"Frank Bruno","nickname":"The Body Snatcher","division":"Heavyweight","age":26,"record":"40-5-0 (38 KO)","overall":77,"style":"Slugger","styleDesc":"Huge power and comes to end it; defense is an afterthought.","stats":[{"label":"Power","value":91},{"label":"Chin","value":71},{"label":"Speed","value":74},{"label":"Defense","value":70},{"label":"Stamina","value":68},{"label":"Accuracy","value":80},{"label":"Conditioning","value":72},{"label":"Cut Resist","value":74},{"label":"Aggression","value":82},{"label":"Heart","value":84}]},{"name":"Tony Tubbs","nickname":"TNT","division":"Heavyweight","age":27,"record":"47-10-0 (25 KO)","overall":78,"style":"Out-Boxer","styleDesc":"Fights at range behind the jab; movement and accuracy over power.","stats":[{"label":"Power","value":77},{"label":"Chin","value":80},{"label":"Speed","value":83},{"label":"Defense","value":85},{"label":"Stamina","value":72},{"label":"Accuracy","value":85},{"label":"Conditioning","value":66},{"label":"Cut Resist","value":78},{"label":"Aggression","value":70},{"label":"Heart","value":76}]}];
const grid = document.getElementById('grid');
const search = document.getElementById('search');
const sortSel = document.getElementById('sort');
const chipBox = document.getElementById('chips');
const countEl = document.getElementById('count');

let activeDivision = 'All';
let activeStyle = 'All';
const styleChipBox = document.getElementById('styleChips');
const divisions = ['All', ...[...new Set(FIGHTERS.map(f => f.division))]];
const styles = ['All', ...[...new Set(FIGHTERS.map(f => f.style))]];

divisions.forEach(d => {
  const c = document.createElement('button');
  c.className = 'chip' + (d === 'All' ? ' active' : '');
  c.textContent = d;
  c.onclick = () => { activeDivision = d; [...chipBox.children].forEach(x => x.classList.remove('active')); c.classList.add('active'); render(); };
  chipBox.appendChild(c);
});

styles.forEach(st => {
  const c = document.createElement('button');
  c.className = 'chip' + (st === 'All' ? ' active' : '');
  c.textContent = st === 'All' ? 'All styles' : st;
  c.onclick = () => { activeStyle = st; [...styleChipBox.children].forEach(x => x.classList.remove('active')); c.classList.add('active'); render(); };
  styleChipBox.appendChild(c);
});

function hue(v){ return Math.round(v * 1.25); }            // 0 red -> 100 green
function color(v){ return `hsl(${hue(v)} 72% 52%)`; }

const STYLE_HUE = { 'Out-Boxer':205, 'Boxer-Puncher':265, 'Slugger':10, 'Swarmer':35, 'Counter-Puncher':150 };
function styleCss(name){
  const h = STYLE_HUE[name] ?? 220;
  return `background:hsl(${h} 70% 50% / .16);border:1px solid hsl(${h} 70% 55% / .55);color:hsl(${h} 80% 80%)`;
}

function radar(stats){
  const n = stats.length, size = 150, cx = size/2, cy = size/2, R = 56;
  const pt = (i, r) => {
    const a = -Math.PI/2 + i * 2*Math.PI/n;
    return [cx + Math.cos(a)*r, cy + Math.sin(a)*r];
  };
  let rings = '';
  [0.25,0.5,0.75,1].forEach(f => {
    const p = stats.map((_,i)=>pt(i,R*f).join(',')).join(' ');
    rings += `<polygon points="${p}" fill="none" stroke="rgba(255,255,255,.08)"/>`;
  });
  let spokes = '';
  stats.forEach((_,i)=>{ const [x,y]=pt(i,R); spokes += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(255,255,255,.06)"/>`; });
  const poly = stats.map((s,i)=>pt(i, R*s.value/100).join(',')).join(' ');
  const dots = stats.map((s,i)=>{ const [x,y]=pt(i,R*s.value/100); return `<circle cx="${x}" cy="${y}" r="2" fill="${color(s.value)}"/>`; }).join('');
  return `<svg class="radar" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    ${rings}${spokes}
    <polygon points="${poly}" fill="rgba(255,90,60,.22)" stroke="var(--accent)" stroke-width="1.5"/>
    ${dots}
  </svg>`;
}

function cardHtml(f){
  const bars = f.stats.map(s => `
    <div class="bar">
      <span class="lbl">${s.label}</span>
      <span class="track"><span class="fill" style="width:${s.value}%;background:${color(s.value)}"></span></span>
      <span class="val">${s.value}</span>
    </div>`).join('');
  const nick = f.nickname ? `<div class="nick">&ldquo;${f.nickname}&rdquo;</div>` : '';
  return `<div class="card">
    <div class="top">
      <div class="ring" style="--v:${f.overall};--rc:${color(f.overall)}"><span>${f.overall}</span></div>
      <div class="ident">
        <div class="name">${f.name}</div>${nick}
        <div class="meta"><span class="badge">${f.division}</span>Age ${f.age} &middot; ${f.record}</div>
        <div class="style" style="${styleCss(f.style)}" title="${f.styleDesc}">${f.style}</div>
      </div>
    </div>
    ${radar(f.stats)}
    <div class="bars">${bars}</div>
  </div>`;
}

function render(){
  const q = search.value.trim().toLowerCase();
  const key = sortSel.value;
  let list = FIGHTERS.filter(f =>
    (activeDivision === 'All' || f.division === activeDivision) &&
    (activeStyle === 'All' || f.style === activeStyle) &&
    (q === '' || f.name.toLowerCase().includes(q) || (f.nickname||'').toLowerCase().includes(q) || f.style.toLowerCase().includes(q)));

  const stat = s => (f => (f.stats.find(x => x.label.toLowerCase() === s)||{}).value || 0);
  list.sort((a,b) => {
    if (key === 'name') return a.name.localeCompare(b.name);
    if (key === 'age') return a.age - b.age;
    if (key === 'power') return stat('power')(b) - stat('power')(a);
    if (key === 'speed') return stat('speed')(b) - stat('speed')(a);
    return b.overall - a.overall;
  });

  countEl.textContent = `${list.length} fighter${list.length===1?'':'s'}`;
  grid.innerHTML = list.length ? list.map(cardHtml).join('') : '<div class="empty">No fighters match.</div>';
}

search.oninput = render;
sortSel.onchange = render;
render();
</script>
</body>
</html>
